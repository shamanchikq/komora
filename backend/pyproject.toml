[project]
name = "komora"
version = "0.1.0"
description = "Personal grocery agent for Silpo — Telegram bot + Mini App"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiogram>=3.30.0",
    "aiosqlite>=0.22.1",
    "alembic>=1.19.1",
    "cryptography>=50.0.0",
    "fastapi>=0.141.1",
    "google-genai>=2.17.0,<3",   # weekly releases; Interactions surface still moving
    "httpx>=0.28.1",
    "mcp==2.0.0",   # pinned exactly: ~12 open OAuth bugs in 2.0, see verified-external-facts §2
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.0.51",
    "uvicorn[standard]>=0.52.1",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.16.2",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
# Third-party SDKs without complete stubs. Our own code stays strict.
[[tool.mypy.overrides]]
module = ["mcp.*", "google.genai.*", "aiogram.*", "respx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --strict-markers"

[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "komora"
module-root = ""
