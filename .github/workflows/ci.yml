name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      # Honours backend/.python-version, so CI and local stay on the same interpreter.
      - name: Install Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy komora

      - name: Test
        run: uv run pytest

      # Catches a tables.py edit that never got a migration. `check` exits non-zero
      # when autogenerate would produce operations.
      - name: Schema matches migrations
        env:
          KOMORA_DATABASE_URL: sqlite+aiosqlite:///./ci-drift-check.db
        run: |
          uv run alembic upgrade head
          uv run alembic check

  # The Mini App is half of Plan 2 and none of it was covered: the Vitest suite, the
  # typecheck and the `npm run build` that produces the very directory FastAPI serves
  # all ran outside CI, so a broken frontend merged green.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      # `build` is `tsc -b && vite build`, so this is the typecheck as well as the
      # artifact. Both matter: `web/dist` is what `create_app` mounts at `/`.
      - name: Build
        run: npm run build

      # The pure modules — the places the frontend restates a backend rule in
      # TypeScript, which is where the two surfaces can disagree silently.
      - name: Test
        run: npm test
